version: '3.8'

services:
  db:
    image: postgres:15
    container_name: juriswatch_db
    environment:
      POSTGRES_USER: juriswatch
      POSTGRES_PASSWORD: juriswatch_password
      POSTGRES_DB: juriswatch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: juriswatch_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
